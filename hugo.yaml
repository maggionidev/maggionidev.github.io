baseURL: 'https://maggioni.dev/'
theme: PaperMod

defaultContentLanguage: pt-BR
defaultContentLanguageInSubdir: true

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

services:
  disqus:
    shortname: maggionidev
  googleAnalytics:
    id: G-3EJS7QXCTZ

privacy:
  googleAnalytics:
    disable: false
    respectDoNotTrack: true

languages:

  pt-BR:
    locale: pt-BR
    label: Português (Brasil)
    weight: 1
    contentDir: content/pt-br
    title: Gabriel Maggioni

    params:
      profileMode:
        enabled: false 
        title: Gabriel Maggioni
        subtitle: |
        imageUrl: /apple-touch-icon.webp
        imageWidth: 120
        imageHeight: 120
        imageTitle: my image

        buttons:
          - name: Archives
            url: archives
          - name: Posts mais recentes 👉
            url: posts

      description: 'Programação, Blender, Unity e DevLogs...'

      editPost:
        URL: >-
          https://github.com/maggionidev/maggionidev.github.io/tree/main/content/pt-br
        Text: 'Encontrou um erro? Sugira alterações!'
        appendFilePath: true

      homeInfoParams:
        Title: "Olá, eu sou o Gabriel Maggioni 👋"
        Content: |

          > Desenvolvedor, curte  Linux, Blender, Unity e automação.

          ---
          
          ### 📌 Destaques do Blog
          
          - **[Otimizando o CachyOS para Jogos](/pt-br/posts/cachyos/guia-amd-cachyos-gaming/)** – Performance e benchmarks.
          
          - **[Guia completo pacman + yay](/pt-br/posts/cachyos/guia-pacman-yay/)** - aprenda a gerenciar seus pacotes arch
          
          - **[Configurando SSH com Tailscale](/pt-br/posts/cachyos/cachyos-tailscale-guide/)** – Acesso remoto seguro.
          
          ---

  en:
  # DESABILITADO TEMPORARIAMENTE
    disabled: true
    locale: en
    label: English
    weight: 2
    contentDir: content/en
    title: Gabriel Maggioni

    params:
      profileMode:
        enabled: false
        title: Gabriel Maggioni
        subtitle: |
        imageUrl: /apple-touch-icon.webp
        imageWidth: 120
        imageHeight: 120
        imageTitle: my image

        buttons:
          - name: View Posts
            url: posts

      description: 'Programming, Blender, Unity and DevLogs...'

      editPost:
        URL: >-
          https://github.com/maggionidev/maggionidev.github.io/tree/main/content/en
        Text: 'Found an issue? Suggest changes!'
        appendFilePath: true

      homeInfoParams:
        Title: "Hi there 👋"
        Content: ...

caches:
  images:
    dir: ':cacheDir/images'

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production

  author: Gabriel Maggioni
  DateFormat: 02/01/2006

  defaultTheme: auto
  disableThemeToggle: false
  comments: true

  keywords:
    - programação
    - desenvolvimento de software
    - desenvolvimento de jogos
    - unity
    - blender
    - gamedev
    - devlog
    - projetos pessoais
    - tecnologia
    - programming
    - software development
    - game development
    - coding
    - 3d modeling
    - indie dev

  images:
    - og-image.webp

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true

  ShareButtons:
    - whatsapp
    - x
    - reddit
    - telegram
    - linkedin

  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false

  showtoc: true
  tocopen: false

  assets:
    favicon: /favicon.ico
    favicon16x16: /favicon-16x16.webp
    favicon32x32: /favicon-32x32.webp
    apple_touch_icon: /apple-touch-icon.webp

  label:
    text: Home
    icon: /apple-touch-icon.webp
    iconHeight: 45

  socialIcons:
    - name: whatsapp
      url: 'https://whatsapp.com/channel/0029VbDEopc7j6g8EHMemN26'
    - name: youtube
      url: 'https://youtube.com/@maggionidev'
    - name: tiktok
      url: 'https://tiktok.com/@maggionidev'
    - name: instagram
      url: 'https://instagram.com/maggionidev'
    - name: x
      url: 'https://x.com/maggionidev'
    - name: github
      url: 'https://github.com/maggionidev'

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.1
    minMatchCharLength: 0
    limit: 10
    keys:
      - title
      - permalink
      - summary
      - content

menu:
  main:
    - identifier: archives
      name: 📂 archives
      url: archives/
      weight: 10

    - identifier: search
      name: 🔎 ...search
      url: /search/
      weight: 20

    - identifier: categories
      name: 🔖 Tags
      url: /tags/
      weight: 30

    - identifier: about
      name: 👋 About Me
      url: /about/
      weight: 40

markup:
  highlight:
    noClasses: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
